# Stage 6: a (local) CDN edge. Real CDNs run this in hundreds of cities so
# bytes travel from nearby instead of from your one origin region.
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:10m max_size=1g
                 inactive=7d use_temp_path=off;

server {
    listen 80;

    location /media/ {
        proxy_pass http://minio:9000;        # origin = the object storage bucket
        proxy_set_header Host minio:9000;
        proxy_cache cdn;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;                 # 100 misses at once = 1 origin fetch
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
