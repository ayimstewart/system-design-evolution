# Stage 8: same load balancer, but it now expects things to fail.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream app {
    zone app 64k;
    least_conn;
    # Take a replica out of rotation after 2 failures, try it again in 10s.
    server app:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 12m;

    location = /lb-health { return 200 "ok\n"; }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fail fast, then retry on a *different* replica.
        # POSTs are NOT retried (no "non_idempotent"): retrying a write can double it.
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
