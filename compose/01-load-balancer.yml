# STAGE 1 — Problem: one server can't keep up.
# Fix: run several copies of the app and put a load balancer in front.
# Cost: servers must be stateless (no local sessions/files), one more hop.
services:
  app:
    ports: !reset []          # only the load balancer is public now
    deploy:
      replicas: 3

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ../infra/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
