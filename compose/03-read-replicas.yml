# STAGE 3 — Problem: reads keep growing, even with a cache.
# Fix: stream copies of the primary to read replicas; send reads there.
# Cost: replicas lag. Read-your-own-write can return old data.
services:
  app:
    environment:
      REPLICA_URLS: postgresql+psycopg://app:app@db-replica:5432/app
    depends_on:
      db-replica:
        condition: service_healthy

  db-replica:
    image: postgres:16-alpine
    user: postgres
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: db-primary
      REPLICATION_PASSWORD: replicator
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-replica:/var/lib/postgresql/data
      - ../infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  db-replica:
