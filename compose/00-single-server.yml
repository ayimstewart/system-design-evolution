# STAGE 0 — One server, one database.
# This is the correct starting point. Resist adding anything until it hurts.
name: sde

services:
  app:
    build: ../app
    image: sde-app:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db-primary:5432/app
      # Knobs that make bottlenecks visible on a fast laptop (see docs/JOURNEY.md):
      SIMULATED_WORK_MS: "20"          # CPU per read request
      SIMULATED_QUERY_MS: "15"         # time each query holds a DB connection
      PROCESSING_DELAY_SECONDS: "2"    # slow image processing
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      REPLICATION_PASSWORD: replicator
    # Replication settings are harmless on a lone primary and save a rebuild in stage 3.
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    volumes:
      - db-primary:/var/lib/postgresql/data
      - ../infra/postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-primary:
